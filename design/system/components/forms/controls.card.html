<!doctype html><html data-theme="light"><head><meta charset="utf-8"><title>Controls</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:var(--space-4);font-family:var(--font-body)}.grid{display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:flex-end}.col{display:grid;gap:var(--space-2);justify-items:start}.cap{font:var(--weight-body) var(--text-meta)/1.4 var(--font-body);color:var(--text-muted)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Switch, Slider, TextField } = window.FreePDFDesignSystem_43ff31;

function Demo(){const [g,setG]=React.useState(false);const [a,setA]=React.useState(true);const [v,setV]=React.useState(12);const [n,setN]=React.useState("");
return (<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"var(--space-4) var(--space-8)",alignItems:"start"}}>
<div style={{display:"grid",gap:"var(--space-1)"}}><Switch label="Grey" checked={g} onChange={setG}/><Switch label="Apply to all pages" sub="Keep the app open." checked={a} onChange={setA}/></div>
<Slider label="Brightness" value={v} min={-50} max={50} suggested={12} minLabel="darker" maxLabel="brighter" onChange={setV}/>
<TextField label="Name for the shared copy" value={n} placeholder="scan" suffix=".pdf" onChange={setN}/>
<Slider label="Straighten" value={-2} min={-15} max={15} unit="°" suggested={-2} minLabel="−15°" maxLabel="15°" disabled/>
</div>);}

ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script></body></html>
