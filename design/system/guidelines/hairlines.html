<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 18px;font-family:var(--font-body);color:var(--text);background:var(--bg)}.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.sw{display:grid;gap:4px}.chip{width:88px;height:56px;border:1px solid var(--divider)}.lbl{font:var(--weight-body) 10px/1.3 var(--font-body);color:var(--text-muted);letter-spacing:.02em}.val{font:var(--weight-body) 10px/1.3 var(--font-body);color:var(--text-muted);font-variant-numeric:tabular-nums}</style></head><body><div style="display:grid;gap:14px;max-width:420px">
<div><div style="border-top:1px solid var(--divider)"></div><div class="lbl">divider — between rows, around outlined controls</div></div>
<div><div style="border-top:1px solid var(--divider-strong)"></div><div class="lbl">divider-strong — a slider track, a switch off</div></div>
<div><div style="border-top:1px solid var(--accent)"></div><div class="lbl">accent — an active edge</div></div>
<div><div style="height:4px;border-top:1px solid var(--accent-700);border-bottom:1px solid var(--accent-700)"></div><div class="lbl">double rule — destructive, without a second colour</div></div>
</div></body></html>
