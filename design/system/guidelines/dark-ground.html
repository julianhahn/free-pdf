<!-- @dsCard group="Brand" viewport="700x260" name="Paper on a dark viewfinder" subtitle="Corner marks, a solid counter ground, and a shutter found by mass not outline" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 18px;font-family:var(--font-body);color:var(--text);background:var(--bg)}.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.sw{display:grid;gap:4px}.chip{width:88px;height:56px;border:1px solid var(--divider)}.lbl{font:var(--weight-body) 10px/1.3 var(--font-body);color:var(--text-muted);letter-spacing:.02em}.val{font:var(--weight-body) 10px/1.3 var(--font-body);color:var(--text-muted);font-variant-numeric:tabular-nums}</style></head><body><div class="row" style="gap:18px;align-items:flex-start">
<div style="position:relative;width:150px;aspect-ratio:3/4;background:var(--viewfinder);border-radius:var(--radius-md);overflow:hidden">
<div style="position:absolute;inset:16% 18%;background:#3a3734"></div>
<span style="position:absolute;width:24px;height:24px;top:6%;left:6%;border-top:2px solid var(--accent);border-left:2px solid var(--accent)"></span><span style="position:absolute;width:24px;height:24px;top:6%;right:6%;border-top:2px solid var(--accent);border-right:2px solid var(--accent)"></span><span style="position:absolute;width:24px;height:24px;bottom:6%;left:6%;border-bottom:2px solid var(--accent);border-left:2px solid var(--accent)"></span><span style="position:absolute;width:24px;height:24px;bottom:6%;right:6%;border-bottom:2px solid var(--accent);border-right:2px solid var(--accent)"></span>
<span style="position:absolute;top:8px;left:8px;padding:4.6px 9.2px;border-radius:2px;background:rgba(19,18,17,.66);border:1px solid rgba(248,244,244,.22);color:var(--neutral-100);font:600 14px/1.2 var(--font-heading);font-variant-numeric:tabular-nums">Page 7</span></div>
<div class="sw" style="padding:16px;background:var(--viewfinder);border-radius:var(--radius-md);place-items:center"><div style="width:72px;height:72px;border-radius:50%;border:2px solid var(--accent);padding:4px;box-sizing:border-box"><div style="width:100%;height:100%;border-radius:50%;background:var(--paper)"></div></div><div class="lbl" style="color:rgba(248,244,244,.6)">shutter, rest</div></div>
<div class="sw" style="padding:16px;background:var(--viewfinder);border-radius:var(--radius-md);place-items:center;opacity:.45"><div style="width:72px;height:72px;border-radius:50%;border:2px solid var(--accent);padding:4px;box-sizing:border-box"><div style="width:100%;height:100%;border-radius:50%;background:var(--paper)"></div></div><div class="lbl" style="color:rgba(248,244,244,.6)">writing the photo</div></div>
<div class="sw" style="max-width:190px"><div class="lbl">A hairline would be a decoration here. The rings go to 2 px, the counter gets a ground, and the shutter carries a solid paper disc.</div></div>
</div></body></html>
