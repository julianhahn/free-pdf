<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 18px;font-family:var(--font-body);color:var(--text);background:var(--bg)}.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.sw{display:grid;gap:4px}.chip{width:88px;height:56px;border:1px solid var(--divider)}.lbl{font:var(--weight-body) 10px/1.3 var(--font-body);color:var(--text-muted);letter-spacing:.02em}.val{font:var(--weight-body) 10px/1.3 var(--font-body);color:var(--text-muted);font-variant-numeric:tabular-nums}</style></head><body><div class="row"><div class="sw"><div class="chip" style="border-radius:2px;background:var(--surface)"></div><div class="lbl">tags, chips</div><div class="val">radius-sm · 2px</div></div><div class="sw"><div class="chip" style="border-radius:4px;background:var(--surface)"></div><div class="lbl">buttons, inputs, cards</div><div class="val">radius-md · 4px</div></div><div class="sw"><div class="chip" style="border-radius:7px;background:var(--surface)"></div><div class="lbl">dialogs</div><div class="val">radius-lg · 7px</div></div>
<div class="sw"><div class="chip" style="width:56px;border-radius:50%;background:var(--surface)"></div><div class="lbl">shutter, knob, thumb</div><div class="val">round · 50%</div></div></div></body></html>
