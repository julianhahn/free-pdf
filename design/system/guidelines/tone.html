<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 18px;font-family:var(--font-body);color:var(--text);background:var(--bg)}.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.sw{display:grid;gap:4px}.chip{width:88px;height:56px;border:1px solid var(--divider)}.lbl{font:var(--weight-body) 10px/1.3 var(--font-body);color:var(--text-muted);letter-spacing:.02em}.val{font:var(--weight-body) 10px/1.3 var(--font-body);color:var(--text-muted);font-variant-numeric:tabular-nums}</style></head><body><div style="display:grid;gap:12px;max-width:560px;font-size:14px;line-height:1.55">
<div><span style="color:var(--accent-700);font:600 13px/1 var(--font-heading);letter-spacing:.08em;text-transform:uppercase">Say</span><div>Tap New scan and photograph the pages, one after another. You can stop whenever you like.</div></div>
<div><span style="color:var(--text-muted);font:600 13px/1 var(--font-heading);letter-spacing:.08em;text-transform:uppercase">Not</span><div style="color:var(--text-muted);text-decoration:line-through">Let's get scanning! 🎉 Your documents are safe with us.</div></div>
<div><span style="color:var(--accent-700);font:600 13px/1 var(--font-heading);letter-spacing:.08em;text-transform:uppercase">Say</span><div>The page runs off the frame. Move back and photograph it again.</div></div>
<div><span style="color:var(--text-muted);font:600 13px/1 var(--font-heading);letter-spacing:.08em;text-transform:uppercase">Not</span><div style="color:var(--text-muted);text-decoration:line-through">Oops — something went wrong. Please try again.</div></div>
</div></body></html>
