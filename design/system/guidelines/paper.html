<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 18px;font-family:var(--font-body);color:var(--text);background:var(--bg)}.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.sw{display:grid;gap:4px}.chip{width:88px;height:56px;border:1px solid var(--divider)}.lbl{font:var(--weight-body) 10px/1.3 var(--font-body);color:var(--text-muted);letter-spacing:.02em}.val{font:var(--weight-body) 10px/1.3 var(--font-body);color:var(--text-muted);font-variant-numeric:tabular-nums}</style></head><body><div class="row" style="gap:16px;align-items:flex-start">
<div style="position:relative;width:96px;aspect-ratio:3/4;background:var(--paper);border:1px solid var(--divider);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);overflow:hidden"><div style="position:absolute;inset:7% 9%;border:1px solid rgba(45,43,43,.12)"></div><div style="position:absolute;inset:12% 14%;background:repeating-linear-gradient(to bottom,rgba(45,43,43,.26) 0 1px,transparent 1px 9px);opacity:.5;-webkit-mask-image:linear-gradient(to bottom,#000 0 62%,transparent 62%)"></div><div style="position:absolute;top:12%;left:14%;width:42%;height:3px;background:rgba(45,43,43,.42)"></div><div style="position:absolute;left:0;bottom:0;padding:1px 4.6px;background:var(--bg);border-top:1px solid var(--divider);border-right:1px solid var(--divider);font:400 11px/1.4 var(--font-body);color:var(--text-muted)">1</div></div><div style="position:relative;width:96px;aspect-ratio:3/4;background:var(--paper);border:1px solid var(--divider);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);overflow:hidden"><div style="position:absolute;inset:7% 9%;border:1px solid rgba(45,43,43,.12)"></div><div style="position:absolute;inset:12% 14%;background:repeating-linear-gradient(to bottom,rgba(45,43,43,.26) 0 1px,transparent 1px 9px);opacity:.5;-webkit-mask-image:linear-gradient(to bottom,#000 0 62%,transparent 62%)"></div><div style="position:absolute;top:12%;left:14%;width:42%;height:3px;background:rgba(45,43,43,.42)"></div><div style="position:absolute;left:0;bottom:0;padding:1px 4.6px;background:var(--bg);border-top:1px solid var(--divider);border-right:1px solid var(--divider);font:400 11px/1.4 var(--font-body);color:var(--text-muted)">2</div></div><div style="position:relative;width:96px;aspect-ratio:3/4;background:var(--paper);border:1px solid var(--divider);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);overflow:hidden"><div style="position:absolute;inset:7% 9%;border:1px solid rgba(45,43,43,.12)"></div><div style="position:absolute;inset:12% 14%;background:repeating-linear-gradient(to bottom,rgba(45,43,43,.26) 0 1px,transparent 1px 9px);opacity:.5;-webkit-mask-image:linear-gradient(to bottom,#000 0 62%,transparent 62%)"></div><div style="position:absolute;top:12%;left:14%;width:42%;height:3px;background:rgba(45,43,43,.42)"></div><div style="position:absolute;left:0;bottom:0;padding:1px 4.6px;background:var(--bg);border-top:1px solid var(--divider);border-right:1px solid var(--divider);font:400 11px/1.4 var(--font-body);color:var(--text-muted)">3</div></div>
<div class="sw" style="max-width:280px"><div class="lbl">The frame is drawn, the image is real: these are placeholders standing in for photographed pages. 3:4 always, portrait fixed.</div></div>
</div></body></html>
