<!-- @dsCard group="Colors" viewport="700x150" name="Destructive without red" subtitle="Carried by words and a double rule; accent-700 light / accent-300 dark" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 18px;font-family:var(--font-body);color:var(--text);background:var(--bg)}.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.sw{display:grid;gap:4px}.chip{width:88px;height:56px;border:1px solid var(--divider)}.lbl{font:var(--weight-body) 10px/1.3 var(--font-body);color:var(--text-muted);letter-spacing:.02em}.val{font:var(--weight-body) 10px/1.3 var(--font-body);color:var(--text-muted);font-variant-numeric:tabular-nums}</style></head><body><div class="row" style="align-items:stretch;gap:18px">
<div class="sw"><div style="display:grid;place-items:center;width:200px;height:56px;color:var(--accent-700);border:1px solid var(--accent-700);border-radius:var(--radius-md);box-shadow:inset 0 0 0 3px var(--bg),inset 0 0 0 4px currentColor;font:600 14px/1.2 var(--font-heading)">Delete photos</div><div class="lbl">light — accent-700</div></div>
<div class="sw" style="background:var(--neutral-900);padding:8px"><div style="display:grid;place-items:center;width:184px;height:56px;color:var(--accent-300);border:1px solid var(--accent-300);border-radius:var(--radius-md);box-shadow:inset 0 0 0 3px var(--neutral-900),inset 0 0 0 4px currentColor;font:600 14px/1.2 var(--font-heading)">Delete photos</div><div class="lbl" style="color:rgba(248,244,244,.58)">dark — accent-300</div></div>
<div class="sw" style="max-width:230px"><div style="padding-left:9.2px;border-left:2px solid var(--accent-700);color:var(--accent-700);font:400 13px/1.55 var(--font-body)">This cannot be undone.</div><div class="lbl">error line</div></div>
</div></body></html>
