<!-- @dsCard group="Spacing" viewport="700x160" name="Shadows" subtitle="Only the dialog is raised. Rows, buttons and cards are flat and outlined" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 18px;font-family:var(--font-body);color:var(--text);background:var(--bg)}.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.sw{display:grid;gap:4px}.chip{width:88px;height:56px;border:1px solid var(--divider)}.lbl{font:var(--weight-body) 10px/1.3 var(--font-body);color:var(--text-muted);letter-spacing:.02em}.val{font:var(--weight-body) 10px/1.3 var(--font-body);color:var(--text-muted);font-variant-numeric:tabular-nums}</style></head><body><div class="row" style="gap:22px;padding:8px 0"><div class="sw"><div class="chip" style="width:120px;height:60px;background:var(--surface);border-radius:var(--radius-md);box-shadow:var(--shadow-sm)"></div><div class="lbl">page frame</div><div class="val">shadow-sm</div></div><div class="sw"><div class="chip" style="width:120px;height:60px;background:var(--surface);border-radius:var(--radius-md);box-shadow:var(--shadow-md)"></div><div class="lbl">reserved</div><div class="val">shadow-md</div></div><div class="sw"><div class="chip" style="width:120px;height:60px;background:var(--surface);border-radius:var(--radius-md);box-shadow:var(--shadow-lg)"></div><div class="lbl">dialog only</div><div class="val">shadow-lg</div></div>
<div class="sw"><div class="chip" style="width:120px;height:60px;background:transparent;border:1px solid var(--divider);border-radius:var(--radius-md)"></div><div class="lbl">the default: flat + hairline</div><div class="val">stroke, not fill</div></div></div></body></html>
