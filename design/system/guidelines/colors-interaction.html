<!-- @dsCard group="Colors" viewport="700x140" name="Interaction tints" subtitle="Hover, pressed, row pressed, focus, disabled" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 18px;font-family:var(--font-body);color:var(--text);background:var(--bg)}.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.sw{display:grid;gap:4px}.chip{width:88px;height:56px;border:1px solid var(--divider)}.lbl{font:var(--weight-body) 10px/1.3 var(--font-body);color:var(--text-muted);letter-spacing:.02em}.val{font:var(--weight-body) 10px/1.3 var(--font-body);color:var(--text-muted);font-variant-numeric:tabular-nums}</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:var(--hover-accent);border-color:var(--accent)"></div><div class="lbl">hover, accent</div><div class="val">accent 12%</div></div>
<div class="sw"><div class="chip" style="background:var(--press-accent);border-color:var(--accent)"></div><div class="lbl">pressed, accent</div><div class="val">accent 22%</div></div>
<div class="sw"><div class="chip" style="background:var(--hover-neutral)"></div><div class="lbl">hover, neutral</div><div class="val">text 7%</div></div>
<div class="sw"><div class="chip" style="background:var(--press-neutral)"></div><div class="lbl">pressed, neutral</div><div class="val">text 14%</div></div>
<div class="sw"><div class="chip" style="background:var(--press-row)"></div><div class="lbl">row pressed</div><div class="val">accent 14%</div></div>
<div class="sw"><div class="chip" style="background:transparent;outline:2px solid var(--accent);outline-offset:2px"></div><div class="lbl">focus ring</div><div class="val">2px, 2px out</div></div>
<div class="sw"><div class="chip" style="background:var(--accent);opacity:.45"></div><div class="lbl">disabled</div><div class="val">45% opacity</div></div>
</div></body></html>
