<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 18px;font-family:var(--font-body);color:var(--text);background:var(--bg)}.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.sw{display:grid;gap:4px}.chip{width:88px;height:56px;border:1px solid var(--divider)}.lbl{font:var(--weight-body) 10px/1.3 var(--font-body);color:var(--text-muted);letter-spacing:.02em}.val{font:var(--weight-body) 10px/1.3 var(--font-body);color:var(--text-muted);font-variant-numeric:tabular-nums}</style></head><body><div class="row" style="align-items:flex-end"><div class="sw"><div style="width:4.6px;height:7.359999999999999px;background:var(--accent);opacity:.85"></div><div class="lbl">space-1</div><div class="val">4.6</div></div><div class="sw"><div style="width:9.2px;height:14.719999999999999px;background:var(--accent);opacity:.85"></div><div class="lbl">space-2</div><div class="val">9.2</div></div><div class="sw"><div style="width:13.8px;height:22.080000000000002px;background:var(--accent);opacity:.85"></div><div class="lbl">space-3</div><div class="val">13.8</div></div><div class="sw"><div style="width:18.4px;height:29.439999999999998px;background:var(--accent);opacity:.85"></div><div class="lbl">space-4</div><div class="val">18.4</div></div><div class="sw"><div style="width:27.6px;height:44.160000000000004px;background:var(--accent);opacity:.85"></div><div class="lbl">space-6</div><div class="val">27.6</div></div><div class="sw"><div style="width:36.8px;height:58.879999999999995px;background:var(--accent);opacity:.85"></div><div class="lbl">space-8</div><div class="val">36.8</div></div></div></body></html>
