<!-- @dsCard group="Colors" viewport="700x120" name="Accent ramp — the one gold" subtitle="No second colour, no red, no green" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 18px;font-family:var(--font-body);color:var(--text);background:var(--bg)}.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.sw{display:grid;gap:4px}.chip{width:88px;height:56px;border:1px solid var(--divider)}.lbl{font:var(--weight-body) 10px/1.3 var(--font-body);color:var(--text-muted);letter-spacing:.02em}.val{font:var(--weight-body) 10px/1.3 var(--font-body);color:var(--text-muted);font-variant-numeric:tabular-nums}</style></head><body><div class="row" style="gap:0"><div class="sw"><div class="chip" style="width:64px;height:52px;border:none;background:var(--accent-100)"></div><div class="val">100</div></div><div class="sw"><div class="chip" style="width:64px;height:52px;border:none;background:var(--accent-200)"></div><div class="val">200</div></div><div class="sw"><div class="chip" style="width:64px;height:52px;border:none;background:var(--accent-300)"></div><div class="val">300</div></div><div class="sw"><div class="chip" style="width:64px;height:52px;border:none;background:var(--accent-400)"></div><div class="val">400</div></div><div class="sw"><div class="chip" style="width:64px;height:52px;border:none;background:var(--accent-500)"></div><div class="val">500</div></div><div class="sw"><div class="chip" style="width:64px;height:52px;border:none;background:var(--accent-600)"></div><div class="val">600</div></div><div class="sw"><div class="chip" style="width:64px;height:52px;border:none;background:var(--accent-700)"></div><div class="val">700</div></div><div class="sw"><div class="chip" style="width:64px;height:52px;border:none;background:var(--accent-800)"></div><div class="val">800</div></div><div class="sw"><div class="chip" style="width:64px;height:52px;border:none;background:var(--accent-900)"></div><div class="val">900</div></div></div></body></html>
