<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 18px;font-family:var(--font-body);color:var(--text);background:var(--bg)}.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.sw{display:grid;gap:4px}.chip{width:88px;height:56px;border:1px solid var(--divider)}.lbl{font:var(--weight-body) 10px/1.3 var(--font-body);color:var(--text-muted);letter-spacing:.02em}.val{font:var(--weight-body) 10px/1.3 var(--font-body);color:var(--text-muted);font-variant-numeric:tabular-nums}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--bg)"></div><div class="lbl">bg</div><div class="val">#2d2b2b</div></div><div class="sw"><div class="chip" style="background:var(--surface)"></div><div class="lbl">surface</div><div class="val">#444141</div></div><div class="sw"><div class="chip" style="background:var(--text)"></div><div class="lbl">text</div><div class="val">#f8f4f4</div></div><div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="lbl">accent</div><div class="val">#e1ad66</div></div><div class="sw"><div class="chip" style="background:var(--divider)"></div><div class="lbl">divider</div><div class="val">text 22%</div></div><div class="sw"><div class="chip" style="background:var(--text-muted)"></div><div class="lbl">text-muted</div><div class="val">text 58%</div></div></div></body></html>
