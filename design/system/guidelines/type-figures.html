<!-- @dsCard group="Type" viewport="700x140" name="Tabular figures" subtitle="Every number on screen, so a counter does not shuffle while it counts" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 18px;font-family:var(--font-body);color:var(--text);background:var(--bg)}.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.sw{display:grid;gap:4px}.chip{width:88px;height:56px;border:1px solid var(--divider)}.lbl{font:var(--weight-body) 10px/1.3 var(--font-body);color:var(--text-muted);letter-spacing:.02em}.val{font:var(--weight-body) 10px/1.3 var(--font-body);color:var(--text-muted);font-variant-numeric:tabular-nums}</style></head><body><div class="row" style="gap:36px">
<div class="sw"><div style="font:600 17px/1.3 var(--font-heading);font-variant-numeric:tabular-nums">12 of 40 pages scanned<br>7 of 40 pages scanned</div><div class="lbl">tabular — the columns hold</div></div>
<div class="sw"><div style="font:600 17px/1.3 var(--font-heading);font-variant-numeric:proportional-nums;opacity:.55">12 of 40 pages scanned<br>7 of 40 pages scanned</div><div class="lbl">proportional — never</div></div>
</div></body></html>
